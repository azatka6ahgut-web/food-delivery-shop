name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start application
        run: docker compose up -d --build

      - name: Install test dependencies
        run: |
          pip install pytest httpx psycopg2-binary pytest-playwright allure-pytest
          playwright install --with-deps chromium

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8000/health; then
              echo "Backend is up"
              exit 0
            fi
            echo "Waiting for backend..."
            sleep 2
          done
          echo "Backend did not start in time"
          exit 1

      - name: Run tests with Allure
        run: python -m pytest test/ -v --alluredir=allure-results
        continue-on-error: true   # чтобы отчёт генерировался даже если тесты упали

      - name: Get Allure history (чтобы тренды сохранялись)
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results
          allure_history: gh-pages/allure-history
          keep_reports: 20

      - name: Deploy report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-history
          destination_dir: allure-history